format_version: 10

pipelines:
  LearnHub-CI-CD:
    group: LearnHub

    materials:
      learnhub_git:
        git: https://github.com/saicharanreddy07/learnhub.git
        branch: main

    stages:
      # Stage 1: Validate source files
      - Validate:
          clean_workspace: true
          jobs:
            validate:
              tasks:
                - exec:
                    command: bash
                    arguments:
                      - -c
                      - |
                        set -e

                        echo "Starting LearnHub validation"

                        test -f backend/app/main.py
                        test -f frontend/package.json
                        test -f docker-compose.yml

                        echo "LearnHub source files verified"

      # Stage 2: Build Docker images
      - Build:
          jobs:
            docker_build:
              tasks:
                - exec:
                    command: bash
                    arguments:
                      - -c
                      - |
                        set -e

                        echo "Checking Docker installation"
                        docker version

                        echo "Checking Docker Compose"
                        docker compose version

                        echo "Validating Compose configuration"
                        docker compose -p learnhub config

                        echo "Building LearnHub images"
                        docker compose -p learnhub build

                        echo "Docker images built successfully"

      # Stage 3: Deploy application
      - Deploy:
          jobs:
            deploy:
              tasks:
                - exec:
                    command: bash
                    arguments:
                      - -c
                      - |
                        set -e

                        echo "Deploying LearnHub"

                        docker compose -p learnhub up -d

                        echo "LearnHub deployment command completed"

      # Stage 4: Verify deployment
      - Verify:
          jobs:
            verify:
              tasks:
                - exec:
                    command: bash
                    arguments:
                      - -c
                      - |
                        set -e

                        echo "Checking LearnHub containers"

                        containers=$(docker compose -p learnhub ps -q)

                        if [ -z "$containers" ]; then
                          echo "ERROR: No LearnHub containers found"
                          exit 1
                        fi

                        for container in $containers; do
                          status=$(docker inspect -f '{{.State.Status}}' "$container")

                          echo "Container $container: $status"

                          if [ "$status" != "running" ]; then
                            echo "ERROR: Container is not running"
                            exit 1
                          fi
                        done

                        echo "LearnHub deployment verified successfully"