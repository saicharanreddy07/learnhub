services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learnhub
      POSTGRES_USER: learnhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnhub_dev_password}
    volumes:
      - learnhub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnhub -d learnhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://learnhub:${POSTGRES_PASSWORD:-learnhub_dev_password}@database:5432/learnhub
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  learnhub_data:
